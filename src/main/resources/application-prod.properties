spring.application.name=devshowcase

# conexao de producao: se DATABASE_URL estiver definida com jdbc:postgresql, usa ela; caso contrario usa h2 em memoria para garantir deploy estavel
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:devshowcasedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs